name: run main.py

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # every hour at :17

jobs:
  build:
    runs-on: self-hosted
    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Show Python version
      - run: python3 --version

      # 3. Set up virtual environment and install uv if missing
      - name: Set up venv and install uv
        run: |
          if [ ! -d ".venv" ]; then
            python3 -m venv .venv
          fi
          # Upgrade pip in venv
          .venv/bin/python -m pip install --upgrade pip
          # Install uv in venv
          .venv/bin/pip install uv

      # 4. Cache pip packages (optional, speeds up repeated installs)
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Sync environment using uv
      - name: Sync environment with uv
        run: .venv/bin/uv sync

      # 6. Execute your Python script using uv
      - name: Execute py script
        env:
          LOCATION: ${{ secrets.LOCATION }}
          NUMBER: ${{ secrets.NUMBER }}
          PASSPORT_NUMBER: ${{ secrets.PASSPORT_NUMBER }}
          SURNAME: ${{ secrets.SURNAME }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP: ${{ secrets.SMTP }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .venv/bin/uv run trigger.py

      # 7. Upload status artifact
      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-artifact
          path: status_record.json
